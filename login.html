<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="js/sw-register.js" defer></script>
  <title>以我 · 登录</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="page auth-page">
    <main class="auth-card fade-in">
      <div class="auth-logo">
        <div class="auth-logo-mark">以</div>
        <div class="auth-app-name">以我</div>
        <div class="auth-app-sub">记录每一天的自己</div>
      </div>

      <div class="field">
        <label for="account">邮箱</label>
        <input class="input" id="account" type="text" placeholder="请输入邮箱" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <div class="field-err" id="login-err"></div>

      <button class="btn primary block" id="login-btn">登录</button>

      <div class="auth-links">
        <a href="register.html">没有账号？去注册</a>
        <a href="javascript:;" id="forgot-pwd">忘记密码？</a>
      </div>
    </main>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
